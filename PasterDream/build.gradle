plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

version = mod_version
group = mod_group_id

evaluationDependsOn(':PasterDreamAPI')

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    // GeckoLib 官方
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    // Curios 官方
    maven {
        name = 'TheIllusiveC4'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroupByRegex 'top\\.theillusivec4.*' }
    }
    // Player Animator 官方
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
        content { includeGroupByRegex 'dev\\.kosmx.*' }
    }
    // JEI（Just Enough Items）
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 为 test sourceSet 添加 Minecraft / NeoForge 编译依赖，
    // 使迁移到 src/test/java 的测试运行器能够编译和运行
    addModdingDependenciesTo(sourceSets.test)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    def apiProject = project(':PasterDreamAPI')
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(apiProject.sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // API 以源码模块依赖；发布时由 jar 任务打进同一 pasterdream jar，玩家只需装一个 mod。
    implementation project(':PasterDreamAPI')

    // 使 PasterDream 的 test sourceSet 能够访问 PasterDreamAPI 的 test sourceSet（gen/example 类）
    testImplementation project(':PasterDreamAPI').sourceSets.test.output

    // ======================== 必需第三方 mod（Maven，开发期进 classpath；不打进发布 jar） ========================
    // 玩家需自行安装同版本或兼容范围的 GeckoLib / Curios / Player Animator。
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}"

    // ======================== JEI 集成（可选依赖） ========================
    // 编译期只依赖 API（common + neoforge 两部分），不会被打进发布 jar；
    // 运行期通过 localRuntime 挂载完整 JEI（localRuntime 不进入发布元数据，
    // 见上方 configurations { runtimeClasspath.extendsFrom localRuntime }），
    // 因此发布 jar 不携带 JEI，玩家未装 JEI 时 @JeiPlugin 插件不会被加载，mod 正常运行。
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
}

// ======================== 单包分发：主 jar 内嵌 PasterDreamAPI ========================
// PasterDreamAPI 不是独立 mod（无 mods.toml），其 class/资源全部并入 pasterdream-*.jar。
// 玩家 mods 目录只放这一个 jar 即可；勿再额外安装 PasterDreamAPI-*.jar。
tasks.named('jar', Jar).configure {
    dependsOn(':PasterDreamAPI:classes')
    // 合并 API 编译输出（classes + resources）
    from project(':PasterDreamAPI').sourceSets.main.output
    // 避免双份 MANIFEST 等元数据冲突
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors,
                'Embedded-Modules': 'PasterDreamAPI'
        )
    }
}

// 产出到统一 dist 目录，便于发布/拷贝到游戏 mods
tasks.register('packageMod', Copy) {
    group = 'distribution'
    description = '打包单一可安装 jar（已内嵌 PasterDreamAPI）到 build/dist/'
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into rootProject.layout.buildDirectory.dir('dist')
    doLast {
        def out = rootProject.layout.buildDirectory.dir('dist').get().asFile
        logger.lifecycle("packageMod → ${out.listFiles()?.collect { it.name }}（仅安装 pasterdream-*.jar，勿再装 PasterDreamAPI）")
    }
}

// assemble / build 时默认带上单包产物
tasks.named('assemble').configure {
    dependsOn tasks.named('packageMod')
}

tasks.named('test', Test).configure {
    failOnNoDiscoveredTests = false
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 允许 runServer 时在控制台中输入命令（标准输入转发）
tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

// ======================== 自定义任务 ========================

tasks.register('checkLang', Exec) {
    description = '检查 zh_cn.json 是否包含所有 PDItems/PDBlocks 注册项的翻译键'
    group = 'verification'
    workingDir = rootProject.projectDir
    commandLine 'python', '.trae/tools/check_lang.py'
    // 仅当脚本返回非 0 时让构建失败，便于 CI 拦截缺失翻译
    ignoreExitValue = false
}

// 在资源处理阶段之前自动校验语言文件完整性
tasks.named('processResources', ProcessResources).configure {
    dependsOn 'checkLang'
}

tasks.register('runRecipeDemo', JavaExec) {
    description = '运行 RecipeAPIDemo，生成示例配方 JSON 到 resources 目录'
    group = 'PasterDream'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.pasterdream.pasterdreammod.api.item.example.RecipeAPIDemo'
    workingDir = project.projectDir
    standardOutput = System.out
}

tasks.register('runDimensionApiDemo', JavaExec) {
    description = '运行 DimensionAPI 示例程序，验证 API 全部功能'
    group = 'PasterDream'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.pasterdream.pasterdreammod.api.dimension.example.DimensionApiDemo'
    workingDir = project.projectDir
    standardOutput = System.out
}

tasks.register('generateDimensionTestJsons', JavaExec) {
    description = '生成维度 API 测试 JSON 文件到 resources 目录'
    group = 'PasterDream'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.pasterdream.pasterdreammod.api.dimension.example.DimensionJsonGenerator'
    workingDir = project.projectDir
    standardOutput = System.out
}

// ======================== API 测试任务 ========================

tasks.register('runParticleApiTest', JavaExec) {
    description = '运行 ParticleAPI 测试，验证粒子 API 核心功能'
    group = 'PasterDream'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.pasterdream.pasterdreammod.test.ParticleApiTestRunner'
    workingDir = project.projectDir
    standardOutput = System.out
}

tasks.register('runEntityApiTest', JavaExec) {
    description = '运行 EntityAPI 测试，验证实体 API 核心功能'
    group = 'PasterDream'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.pasterdream.pasterdreammod.test.EntityApiTestRunner'
    workingDir = project.projectDir
    standardOutput = System.out
}

tasks.register('runRuinApiTest', JavaExec) {
    description = '运行 RuinAPI 测试，验证自定义遗迹 API 核心功能'
    group = 'PasterDream'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.pasterdream.pasterdreammod.test.RuinApiTestRunner'
    workingDir = project.projectDir
    standardOutput = System.out
}

tasks.register('runAllApiTests', JavaExec) {
    description = '运行所有 API 测试（ParticleAPI + EntityAPI + RuinAPI）'
    group = 'PasterDream'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.pasterdream.pasterdreammod.test.RunAllApiTests'
    workingDir = project.projectDir
    standardOutput = System.out
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
