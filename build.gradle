// Root build.gradle for PasterDreamParent multi-module project.
// All build logic is in the submodule build.gradle files.
// See: PasterDreamAPI/build.gradle (API library) and PasterDream/build.gradle (main mod).
//
// 分发约定：玩家只安装一个 jar
//   ./gradlew packageMod
//   → build/dist/pasterdream-<version>.jar
//     （Jar-in-Jar 内嵌 PasterDreamAPI + enable*=true 的 Sanity/MeltDream/Spells）
//
// 客户端启动：必须使用 PasterDream 的 runClient，避免多子项目歧义
//   ./gradlew :PasterDream:runClient
//   （若直接从根目录运行 ./gradlew runClient，也会自动代理到 :PasterDream:runClient）

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// 打包产物自动归档任务：将 build/dist 下的 jar 移动到项目根目录的 打包产物/ 文件夹
def distScript = rootProject.file('tools/dist_to_folder.py')
tasks.register('deployDist', Exec) {
    group = 'distribution'
    description = '归档 build/dist 产物到 打包产物/（自动）'
    workingDir = rootProject.projectDir
    commandLine 'python', distScript.absolutePath
    onlyIf { distScript.exists() }
}

tasks.register('packageMod') {
    group = 'distribution'
    description = '构建并收集单一可安装 jar 到 build/dist/（内嵌 API + 附属）并归档到 打包产物/'
    dependsOn ':PasterDream:packageMod'
    dependsOn tasks.named('deployDist')
}

// 完整包 = 主模 fat jar（与 packageMod 相同；附属已 JiJ，勿再并排放独立附属 jar）
tasks.register('packageAll') {
    group = 'distribution'
    description = '打包完整可安装 jar（主模内嵌 API + Sanity/MeltDream/Spells）并归档到 打包产物/'
    dependsOn tasks.named('packageMod')
}

// 可选：分别产出附属 thin jar（不含 API；需与「未内嵌对应附属」的主包搭配，勿与 fat 主包同装）
// 任务名用 packageThin，避免 `gradlew packageMod` 按名称匹配到附属子项目。
tasks.register('packageAddonsSeparate') {
    group = 'distribution'
    description = '仅打包三个附属 thin jar 到 build/dist/（模块化发行用；勿与已内嵌附属的主包同时装）'
    dependsOn ':PasterDreamMeltDream:packageThin'
    dependsOn ':PasterDreamSanity:packageThin'
    dependsOn ':PasterDreamSpells:packageThin'
    dependsOn tasks.named('deployDist')
}

// 强制归档任务在全部相关打包完成后才执行，避免移动空产物
tasks.named('deployDist').configure {
    mustRunAfter ':PasterDream:packageMod',
            ':PasterDreamMeltDream:packageThin',
            ':PasterDreamSanity:packageThin',
            ':PasterDreamSpells:packageThin'
}

tasks.register('runClient') {
    group = 'PasterDream'
    description = '启动游戏客户端（代理到 :PasterDream:runClient）'
    dependsOn ':PasterDream:runClient'
}

tasks.register('runServer') {
    group = 'PasterDream'
    description = '启动游戏服务端（代理到 :PasterDream:runServer）'
    dependsOn ':PasterDream:runServer'
}

tasks.register('runData') {
    group = 'PasterDream'
    description = '运行数据生成（代理到 :PasterDream:runData）'
    dependsOn ':PasterDream:runData'
}
