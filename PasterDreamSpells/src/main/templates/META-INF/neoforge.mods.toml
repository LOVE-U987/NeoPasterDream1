modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="pasterdreamspells"
version="${mod_version}"
displayName="PasterDreamSpells"
description='''
PasterDream 法术系统附属模组。
提供法术卷轴、法杖、法术投射物与场地效果。
'''

[[dependencies.pasterdreamspells]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.pasterdreamspells]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.pasterdreamspells]]
modId="pasterdream"
type="required"
versionRange="[${mod_version},)"
ordering="AFTER"
side="BOTH"
reason="需要 PasterDream 主模组提供 PasterDreamAPI（法术与投射物 API）"

[[dependencies.pasterdreamspells]]
modId="pasterdreamsanity"
type="optional"
versionRange="[${mod_version},)"
ordering="AFTER"
side="BOTH"
reason="部分法术消耗 San 值"

[[dependencies.pasterdreamspells]]
modId="pasterdreammeltdream"
type="optional"
versionRange="[${mod_version},)"
ordering="AFTER"
side="BOTH"
reason="部分法术消耗融梦能量"
