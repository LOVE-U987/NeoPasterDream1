plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

version = mod_version
group = mod_group_id

evaluationDependsOn(':PasterDreamAPI')

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        name = 'TheIllusiveC4'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroupByRegex 'top\\.theillusivec4.*' }
    }
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
        content { includeGroupByRegex 'dev\\.kosmx.*' }
    }
}

base {
    archivesName = 'pasterdreammeltdream'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo(sourceSets.test)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pasterdreammeltdream'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pasterdreammeltdream'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pasterdreammeltdream'
        }

        data {
            data()
            programArguments.addAll '--mod', 'pasterdreammeltdream', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    def apiProject = project(':PasterDreamAPI')
    def mainProject = project(':PasterDream')
    mods {
        "pasterdreammeltdream" {
            sourceSet(sourceSets.main)
        }
        "pasterdream" {
            sourceSet(mainProject.sourceSets.main)
        }
        "pasterdreamapi" {
            sourceSet(apiProject.sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':PasterDreamAPI')

    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Implementation-Title': 'PasterDreamMeltDream',
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors
        )
    }
}

// 产出到统一 dist 目录，便于发布/拷贝到游戏 mods
// 附属模组不内嵌 PasterDreamAPI，运行时依赖 PasterDream 主模组提供
tasks.register('packageThin', Copy) {
    group = 'distribution'
    description = '打包附属 thin jar 到 build/dist/（模块化发行；勿与已内嵌附属的主包同装）'
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into rootProject.layout.buildDirectory.dir('dist')
    doLast {
        def out = rootProject.layout.buildDirectory.dir('dist').get().asFile
        logger.lifecycle("packageThin → ${out.listFiles()?.collect { it.name }}")
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : 'pasterdreammeltdream',
            mod_name               : 'PasterDreamMeltDream',
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    failOnNoDiscoveredTests = false
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
