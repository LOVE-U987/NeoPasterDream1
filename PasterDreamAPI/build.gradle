plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'PasterDreamAPI'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Implementation-Title': 'PasterDreamAPI',
                'Implementation-Version': project.version,
                'Automatic-Module-Name': 'pasterdream.api'
        )
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 为 test sourceSet 添加 Minecraft / NeoForge 编译依赖，
    // 使迁移到 src/test/java 的 dimension/example/ 示例类能够编译
    addModdingDependenciesTo(sourceSets.test)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : 'pasterdreamapi',
            mod_name               : 'PasterDream API',
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// test sourceSet 中存放的是示例/工具类，没有 JUnit 测试，
// 关闭"未发现测试即失败"的校验，避免 build 任务中断
tasks.named('test', Test).configure {
    failOnNoDiscoveredTests = false
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        name = 'TheIllusiveC4'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroupByRegex 'top\\.theillusivec4.*' }
    }
}

dependencies {
    // API 仅编译期需要类型；运行与分发由主模组 implementation 拉齐
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}
